name: ci
on: [push, pull_request]
jobs:
  test:
    name: Julia ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11"]
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "${{ matrix.version }}" }
      - uses: julia-actions/cache@v2
      - run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - run: julia --project=. examples/run_all.jl
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with: { version: "1.11" }
      - uses: julia-actions/cache@v2
      - run: julia --project=docs -e 'using Pkg; Pkg.develop(path = "."); Pkg.instantiate()'
      - run: julia --project=docs docs/make.jl
